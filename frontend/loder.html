    <style>
        /* استایل‌های لودر */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-logo {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0F172A;
            margin: 0;
        }

        .loader-text {
            font-size: 0.875rem;
            color: #64748b;
            margin: 0;
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- بخش لودر -->
    <div id="loader">
        <div class="loader-content">
            <!-- لوگوی SVG -->
            <svg viewBox="0 0 100 100" style="width: 80px; height: 80px;">
                <rect x="5" y="5" width="90" height="90" rx="12" ry="12" 
                      fill="none" stroke="#2563EB" stroke-width="8" />
                <text x="50" y="58" dominant-baseline="middle" text-anchor="middle" 
                      font-family="sans-serif" font-weight="900" font-size="40" fill="#2563EB">
                    RS
                </text>
            </svg>

            <h1 class="loader-logo">Rohullah Sadat</h1>
            <div class="loader-spinner"></div>
            <p class="loader-text">Loading...</p>
        </div>
    </div>

    <!-- سایر محتویات سایت شما در اینجا قرار می‌گیرد -->
    <main>
