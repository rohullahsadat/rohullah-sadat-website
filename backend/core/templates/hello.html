<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
    }

    .projects {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .project-card {
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: #f8f8f8;
    }

    .project-card h3 {
        margin-top: 0;
    }

    .project-card small {
        color: #666;
    }
</style>
<section>
    <h2>My Projects</h2>

    {% if projects %}

        <div class="projects">

            {% for project in projects %}

                <article class="project-card">

                    <h3>{{ project.title }}</h3>

                    <p>{{ project.description }}</p>

                    <small>
                        Created: {{ project.created_at }}
                    </small>

                </article>

            {% endfor %}

        </div>

    {% else %}

        <p>No projects available.</p>

    {% endif %}
</section>

</body>
</html>
